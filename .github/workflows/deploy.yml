name: Build, test and deploy to GitHub Pages

# ⚠️ معطّل مؤقتًا عن التشغيل التلقائي.
#
# حساب GitHub الحالي مقفل بسبب مشكلة فوترة، فلا تعمل الـ Actions إطلاقًا،
# وكل دفعة كانت ستنتج تشغيلًا فاشلًا ورسالة بريد. النشر يتم حاليًا يدويًا:
#
#     npm run deploy
#
# وهو يبني المشروع ويدفع مجلد dist إلى فرع gh-pages مباشرة بلا Actions.
#
# بعد حل مشكلة الفوترة (Actions مجانية بلا حدود للمستودعات العامة):
#   1) أعِد تفعيل محفّز push أدناه
#   2) غيّر مصدر Pages إلى GitHub Actions من Settings → Pages
on:
  workflow_dispatch: # تشغيل يدوي فقط من تبويب Actions حاليًا

permissions:
  contents: read
  pages: write
  id-token: write

# نشرة واحدة في كل مرة؛ دفعة جديدة تلغي التي قبلها
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: تثبيت التبعيات
        run: npm ci

      # الاختبارات تعمل قبل النشر: كود مكسور لا يصل إلى الرابط الحيّ أبدًا
      - name: تشغيل الاختبارات
        run: npm test

      - name: بناء حزمة الإنتاج
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
